<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hành Trình Số - Lê Quý Đôn</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --primary: #1a73e8; --success: #34a853; --warning: #f9ab00; --danger: #d93025; --text: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; transition: 0.3s; }
        .screen { display: none; min-height: 100vh; padding: 25px; box-sizing: border-box; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .active { display: flex; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        input { width: 100%; max-width: 300px; padding: 15px; border-radius: 12px; border: 2px solid #334155; background: var(--card); color: white; margin-top: 15px; outline: none; }
        .btn-team { width: 100%; max-width: 300px; padding: 18px; margin: 8px 0; border-radius: 15px; font-weight: bold; border: none; color: white; cursor: pointer; }
        .header-game { background: var(--card); width: 100%; padding: 15px; position: sticky; top: 0; border-bottom: 3px solid var(--primary); z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .item-card { background: var(--card); padding: 12px; border-radius: 15px; border: 1px solid #334155; text-align: center; }
        .btn-buy { background: var(--primary); color: white; border: none; width: 100%; padding: 10px; border-radius: 8px; font-weight: bold; margin-top: 5px; }
        .over-budget { background: #450a0a !important; } /* Hiệu ứng khi vượt 150k */
        .receipt { background: white; color: black; padding: 25px; border-radius: 5px; width: 100%; max-width: 280px; text-align: left; font-family: 'Courier New', monospace; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body id="main-body">

    <div id="step-1" class="screen active">
        <h2>XIN CHÀO!</h2>
        <input type="text" id="player-name" placeholder="Nhập Họ và Tên...">
        <button class="btn-team" style="background:var(--warning); color:#000; margin-top:20px;" onclick="goToStep(2)">BẮT ĐẦU →</button>
    </div>

    <div id="step-2" class="screen">
        <h2>THỂ TRẠNG HIỆN TẠI?</h2>
        <button class="btn-team" style="background:var(--primary)" onclick="pickTeam('A', 'NHÓM GẦY')">🏃‍♂️ NHÓM GẦY</button>
        <button class="btn-team" style="background:var(--success)" onclick="pickTeam('B', 'NHÓM BÉO')">🚶‍♂️ NHÓM BÉO</button>
        <button class="btn-team" style="background:var(--warning); color:#000" onclick="pickTeam('C', 'BÌNH THƯỜNG')">🧘‍♂️ BÌNH THƯỜNG</button>
    </div>

    <div id="step-3" class="screen">
        <h2>🛒 NHIỆM VỤ</h2>
        <p>Chào <b><span id="n-lab"></span></b>!</p>
        <p id="mission-text"></p>
        <button class="btn-team" style="background:var(--primary)" onclick="goToStep(4)">VÀO SIÊU THỊ</button>
    </div>

    <div id="step-4" class="screen" style="padding:0; justify-content: flex-start;">
        <div class="header-game" id="game-header">
            <div style="display:flex; justify-content: space-between;"><span id="p-name-d"></span> <span id="local-h">🥗 100</span></div>
            <div id="local-b" style="font-size: 1.5em; font-weight:bold; color:var(--warning)">💰 0đ / 150k</div>
        </div>
        <div class="market-grid" id="market-list"></div>
        <button class="btn-team" style="background:var(--success); width:90%; margin:20px 0;" onclick="goToStep(5)">✅ XUẤT HÓA ĐƠN</button>
    </div>

    <div id="step-5" class="screen">
        <div class="receipt">
            <center><b>LÊ QUÝ ĐÔN - QUYẾT THẮNG</b><br>KẾT QUẢ DINH DƯỠNG</center>
            <hr style="border: 1px dashed #ccc">
            Họ tên: <b id="f-name"></b><br>
            Mục tiêu: <b id="f-team"></b><br>
            Tổng chi: <b id="f-budget">0đ</b><br>
            Sức khỏe: <b id="f-health">100</b><br>
            <hr style="border: 1px dashed #ccc">
            <center><small id="ai-status">Mời thầy cô theo dõi Dashboard.<br>AI đang chuẩn bị phản biện!</small></center>
        </div>
        <button class="btn-team" style="background:#475569; margin-top:20px;" onclick="location.reload()">CHƠI LẠI</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDj_9zzB1yYoiR7D4So5P-y-YbPVDdrgNk",
            authDomain: "lequydon-ai.firebaseapp.com",
            databaseURL: "https://lequydon-ai-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "lequydon-ai",
            storageBucket: "lequydon-ai.firebasestorage.app",
            messagingSenderId: "613376871526",
            appId: "1:613376871526:web:d61a4978c7284f7f1df1a7"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let pName = "", pTeam = "", pTeamCode = "", curB = 0, curH = 100;

		const foods = [
			{e:"🍗", n:"Ức gà", p:45000, h:15, type:"protein"},
			{e:"🥚", n:"Trứng gà", p:15000, h:10, type:"protein"},
			{e:"🥩", n:"Thịt bò", p:65000, h:20, type:"protein"},
			{e:"🐟", n:"Cá hồi", p:80000, h:25, type:"protein"},
			{e:"🥛", n:"Sữa tươi", p:15000, h:10, type:"protein"},
			{e:"🥗", n:"Salad", p:25000, h:15, type:"fiber"},
			{e:"🥦", n:"Bông cải", p:20000, h:12, type:"fiber"},
			{e:"🍎", n:"Táo đỏ", p:12000, h:8, type:"fiber"},
			{e:"🍌", n:"Chuối", p:8000, h:7, type:"fiber"},
			{e:"🥑", n:"Bơ sáp", p:35000, h:15, type:"fiber"},
			{e:"🍚", n:"Cơm lứt", p:20000, h:12, type:"carb"},
			{e:"🍠", n:"Khoai lang", p:15000, h:10, type:"carb"},
			{e:"🍜", n:"Mì ly", p:10000, h:-15, type:"junk"},
			{e:"🍔", n:"Burger", p:55000, h:-20, type:"junk"},
			{e:"🌭", n:"Xúc xích", p:20000, h:-12, type:"junk"},
			{e:"🍟", n:"Khoai tây chiên", p:30000, h:-15, type:"junk"},
			{e:"🧋", n:"Trà sữa", p:40000, h:-25, type:"sugar"},
			{e:"🥤", n:"Nước ngọt", p:12000, h:-18, type:"sugar"},
			{e:"🍰", n:"Bánh ngọt", p:35000, h:-20, type:"sugar"},
			{e:"🥜", n:"Hạt điều", p:45000, h:15, type:"fiber"}
		];

        function goToStep(s) {
            if(s === 2) {
                pName = document.getElementById('player-name').value.trim();
                if(!pName) return alert("Thầy cô nhập tên để AI nhận diện nhé!");
                document.getElementById('n-lab').innerText = pName;
                document.getElementById('p-name-d').innerText = pName;
                document.getElementById('f-name').innerText = pName;
            }
            if(s === 4) renderMarket();
            if(s === 5) {
                document.getElementById('f-budget').innerText = curB.toLocaleString() + "đ";
                document.getElementById('f-health').innerText = curH;
                db.ref('players/' + pName).update({ status: "Đã xong ✅" });
            }
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById('step-' + s).classList.add('active');
        }

        function pickTeam(code, name) {
            pTeamCode = code;
            pTeam = name;
            document.getElementById('f-team').innerText = name;
            
            let mission = "";
            if(code === 'A') mission = "Bạn đang Gầy. Hãy chi tiêu tối đa 150k để mua thực phẩm giàu đạm (Ức gà, Sữa) để tăng cân nhé!";
            if(code === 'B') mission = "Bạn đang Béo. Hãy dùng 150k để chọn thực phẩm xanh (Salad, Táo), tránh xa đồ ngọt!";
            if(code === 'C') mission = "Bạn đang Bình thường. Hãy cân đối dinh dưỡng và đừng tiêu quá 150k!";
            document.getElementById('mission-text').innerText = mission;

            // Reset dữ liệu cá nhân (Khởi điểm 100 sức khỏe)
            db.ref('players/' + pName).set({ 
                name: pName, team: name, status: "🛒 Mua sắm", b: 0, h: 100 
            });

            // Lắng nghe dữ liệu để cập nhật UI điện thoại
            db.ref('players/' + pName).on('value', snap => {
                const d = snap.val();
                if(!d) return;
                curB = d.b; curH = d.h;
                document.getElementById('local-b').innerText = "💰 " + curB.toLocaleString() + "đ / 150k";
                document.getElementById('local-h').innerText = "🥗 " + curH;
                
                // Cảnh báo vượt ngân sách
                if(curB > 150000) {
                    document.getElementById('main-body').classList.add('over-budget');
                    document.getElementById('local-b').style.color = "white";
                } else {
                    document.getElementById('main-body').classList.remove('over-budget');
                    document.getElementById('local-b').style.color = "var(--warning)";
                }
            });

            goToStep(3);
        }

        function renderMarket() {
            const list = document.getElementById('market-list');
            list.innerHTML = "";
            foods.forEach(f => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `<span>${f.e}</span><br><small>${f.n}</small><br><b>${f.p.toLocaleString()}đ</b><br><button class="btn-buy" onclick="buy('${f.n}', ${f.p}, ${f.h}, '${f.type}')">CHỌN</button>`;
                list.appendChild(card);
            });
        }

        // Biến tạm để lưu danh sách món trên điện thoại
		let myCart = [];

		function buy(foodName, price, health, type) {
			let finalH = health;
			
			// Logic cá nhân hóa theo nhóm
			if(pTeamCode === 'A') { // Nhóm Gầy
				if(type === 'protein') finalH = health * 2;
			} else if(pTeamCode === 'B') { // Nhóm Béo
				if(type === 'fiber') finalH = health * 2;
				if(type === 'junk' || type === 'sugar') finalH = health * 3;
			}

			// THÊM: Lưu tên món vào danh sách
			myCart.push(foodName);

			// 1. Cập nhật Tổng Nhóm
			db.ref('game/' + pTeamCode).transaction(c => {
				c = c || {b:0, h:0};
				return {b: (c.b || 0) + price, h: (c.h || 0) + finalH};
			});

			// 2. Cập nhật Cá nhân (Thêm trường 'cart' để Dashboard đọc được)
			db.ref('players/' + pName).update({ 
				b: curB + price, 
				h: curH + finalH,
				cart: myCart.join(", ") // Gửi danh sách món lên Firebase
			});

			if(navigator.vibrate) navigator.vibrate(50);
		}
    </script>
</body>
</html>
