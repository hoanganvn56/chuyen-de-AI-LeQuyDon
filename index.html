<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Real-time AI - Lê Quý Đôn</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --bg: #020617; --card: #1e293b; --primary: #3b82f6; --success: #22c55e; --warning: #eab308; --danger: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; padding-bottom: 120px; }
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .team-card { background: var(--card); border-radius: 20px; padding: 20px; border: 3px solid #334155; text-align: center; }
        .team-card.over { border-color: var(--danger); box-shadow: 0 0 20px var(--danger); }
        .team-val { font-size: 3.5em; font-weight: bold; color: var(--warning); margin: 10px 0; }
        .player-list-container { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #334155; max-height: 400px; overflow-y: auto; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; text-align: left; }
        .btn-small-ai { background: #8b5cf6; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 0.85em; font-weight: bold; }
        #ai-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; color: black; padding: 30px; border-radius: 25px; z-index: 2000; box-shadow: 0 0 60px rgba(0,0,0,0.9); width: 450px; text-align: center; border: 6px solid var(--primary); }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1999; }
        .footer-controls { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; padding: 20px; text-align: center; display: flex; justify-content: center; gap: 30px; border-top: 2px solid var(--primary); }
        .btn { padding: 15px 35px; border-radius: 50px; font-weight: bold; border: none; cursor: pointer; font-size: 1.1em; }
        .loading-dots:after { content: ' .'; animation: dots 1.2s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { color: rgba(0,0,0,0); } 40% { color: #334155; } 60% { text-shadow: .25em 0 0 #334155; } 80%, 100% { text-shadow: .25em 0 0 #334155, .5em 0 0 #334155; } }
    </style>
</head>
<body>

    <h2 style="text-align: center; letter-spacing: 2px;">HỘI TRƯỜNG LÊ QUÝ ĐÔN QUYẾT THẮNG | 2026</h2>

    <div class="summary-grid">
        <div class="team-card" id="card-A"><h3 style="color:var(--primary)">NHÓM GẦY</h3><div class="team-val" id="b-A">0đ</div><div id="h-A">🥗 Sức khỏe: 0</div></div>
        <div class="team-card" id="card-C"><h3 style="color:var(--warning)">BÌNH THƯỜNG</h3><div class="team-val" id="b-C">0đ</div><div id="h-C">🥗 Sức khỏe: 0</div></div>
        <div class="team-card" id="card-B"><h3 style="color:var(--success)">NHÓM BÉO</h3><div class="team-val" id="b-B">0đ</div><div id="h-B">🥗 Sức khỏe: 0</div></div>
    </div>

    <div class="player-list-container">
        <h3 style="margin-top:0; color: var(--primary);">👥 GIÁO VIÊN THAM GIA (<span id="p-count">0</span>)</h3>
        <table>
            <thead>
                <tr><th>Họ Tên</th><th>Nhóm</th><th>Đã chi tiêu</th><th>Sức khỏe</th><th>Hành động</th></tr>
            </thead>
            <tbody id="player-list"></tbody>
        </table>
    </div>

    <div id="ai-modal">
        <h2 id="ai-title" style="color:var(--primary); margin-top:0;">🤖 AI PHẢN BIỆN</h2>
        <div id="ai-result" style="font-size: 1.2em; line-height: 1.6; color: #1e293b; min-height: 80px; text-align: left; padding: 10px;"></div>
        <button onclick="closeModal()" class="btn" style="background:var(--primary); color:white; margin-top:20px; width: 100%;">ĐÓNG</button>
    </div>
    <div class="overlay" id="overlay" onclick="closeModal()"></div>

    <div class="footer-controls">
        <button class="btn" style="background:#475569; color:white;" onclick="resetData()">🔄 LÀM MỚI TOÀN BỘ</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDj_9zzB1yYoiR7D4So5P-y-YbPVDdrgNk",
            authDomain: "lequydon-ai.firebaseapp.com",
            databaseURL: "https://lequydon-ai-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "lequydon-ai",
            storageBucket: "lequydon-ai.firebasestorage.app",
            messagingSenderId: "613376871526",
            appId: "1:613376871526:web:d61a4978c7284f7f1df1a7"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('game').on('value', snap => {
            const data = snap.val() || {A:{b:0,h:0}, B:{b:0,h:0}, C:{b:0,h:0}};
            ['A', 'B', 'C'].forEach(t => {
                const b = data[t]?.b || 0;
                document.getElementById('b-'+t).innerText = b.toLocaleString() + 'đ';
                document.getElementById('h-'+t).innerText = "🥗 Sức khỏe: " + (data[t]?.h || 0);
                if(b > 150000) document.getElementById('card-'+t).classList.add('over');
                else document.getElementById('card-'+t).classList.remove('over');
            });
        });

        db.ref('players').on('value', snap => {
            const list = document.getElementById('player-list');
            list.innerHTML = "";
            const players = snap.val();
            if(!players) { document.getElementById('p-count').innerText = "0"; return; }
            const entries = Object.entries(players);
            document.getElementById('p-count').innerText = entries.length;
            entries.forEach(([id, p]) => {
                const budget = p.b || 0;
                const health = p.h || 0;
                const row = `<tr>
                    <td><b>${p.name}</b></td><td>${p.team}</td>
                    <td style="color: var(--warning); font-weight:bold;">${budget.toLocaleString()}đ</td>
                    <td>🥗 ${health}</td>
                    <td><button class="btn-small-ai" onclick="analyzePlayer('${p.name}', '${p.team}', ${budget}, ${health})">🤖 AI PHẢN BIỆN</button></td>
                </tr>`;
                list.insertAdjacentHTML('beforeend', row);
            });
        });

        // --- HÀM GỌI AI: SỬA LẠI MODEL ID KHỚP VỚI ẢNH THỰC TẾ ---
        async function analyzePlayer(name, team, b, h) {
            const API_KEY = "AIzaSyB3SisVd_PTBxHPZukQQWhfitgPCJzap8Y";
            // Sử dụng chính xác model ID thầy thấy trong Playground 2026
            const modelId = "gemini-3.1-flash-lite-preview"; 
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${API_KEY}`;
            
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('ai-modal').style.display = 'block';
            document.getElementById('ai-title').innerText = "AI đang phản biện...";
            document.getElementById('ai-result').innerHTML = `<div class="loading-dots" style="text-align:center;">Đang soi giỏ hàng của thầy/cô ${name}</div>`;

            const promptText = `Bạn là chuyên gia dinh dưỡng dí dỏm tại trường Lê Quý Đôn. Hãy nhận xét giáo viên ${name}, nhóm ${team}. Họ tiêu ${b.toLocaleString()}đ và điểm sức khỏe là ${h}. Viết 1 câu nhận xét ngắn gọn và thông minh.`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    document.getElementById('ai-title').innerText = "AI Phản biện: " + name;
                    document.getElementById('ai-result').innerText = data.candidates[0].content.parts[0].text;
                } else {
                    document.getElementById('ai-result').innerText = "⚠️ Google báo: " + (data.error ? data.error.message : "Mô hình này đang bận.");
                }
            } catch (error) {
                document.getElementById('ai-result').innerText = "⚠️ Lỗi mạng hoặc mạng trường đang chặn AI!";
            }
        }

        window.closeModal = () => {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('ai-modal').style.display = 'none';
        };

        window.resetData = () => {
            if(confirm("Xóa sạch dữ liệu chơi lại?")) db.ref('/').set({ game: {A:{b:0,h:0}, B:{b:0,h:0}, C:{b:0,h:0}}, players: {} });
        };
    </script>
</body>
</html>
